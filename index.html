const DPR=Math.min(window.devicePixelRatio||1,2);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ===== レール（毎回ランダム：正方形・円・正三角形・直線） ===== */
const HS=346,R=26,RW=14,WALL=HS-RW,BS=2; // （一辺のレール直線部分＝2×(HS−R)＝640。壁の内側の面積＝(2×(HS−7))²≒46万で、円・三角・直線もこの面積にそろえる） 正方形：レール中心線の半分の幅／角の丸め／壁＝レールの内側の線
let segs=[],L=0,RAIL={open:false,s0:0,name:'square'},AR={pl:[],circ:false,wr:0,sx:0,sy:0};
// 正n角形のレール（aは中心線の内接円の半径、角はRで丸める）。底の辺から始めて、画面上で左回り
function mkPoly(n,a){
  segs=[];const tau=Math.PI*2/n,K=a-R,cd=K/Math.cos(tau/2),el=2*K*Math.tan(tau/2);

    segs.push({t:0,x:Math.cos(cb)*cd+Math.cos(f)*R,y:Math.sin(cb)*cd+Math.sin(f)*R,dx:Math.sin(f),dy:-Math.cos(f),len:el});

const LINE_FIXED=false; // 直線ステージの方式：false＝最初の方式（画面の幅・高さに合わせて広がる。横は画面の端から端まで）／true＝固定の横長3:5（面積を他の図形とそろえ、ズームもlineViewで決める）

let AC=null;
const unlock=()=>{try{
  if(!save.sfx)return; // 効果音がオフなら、音声機能を起動しない（起動すると、他アプリの音楽などが止まることがある）

    navigator.audioSession.type=ios?'playback':'ambient';
  }
  if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  loadSnds(); // 埋め込み音声（ファイル末尾のSOUNDS）のデコードを始める
}catch(_){}};

/* --- 埋め込み音声：ファイルの一番最後の <script id="snd"> に window.SOUNDS={名前:'data:audio/...;base64,...'} で入れてある。playSnd('名前',音量) で鳴らす（まだ読み込めていない時はfalseを返すので、従来の合成音に切り替える） --- */
const SND_BUF={};
const SND_PEND={}; // デコード中の音の目印（終わったら解決する）。最初の操作が「撃つ」のとき、読み込みを待って本物の音を鳴らすのに使う
const SND_OFF={}; // 音ごとの「頭の無音」の長さ(秒)。デコード後に測り、再生を音が始まる位置から始める
const SND_LEAD_RATIO=0.03,SND_LEAD_KEEP=0.003; // 最大音量の3%を超えた所を音の始まりとみなす／始まりの少し前（3ms）は残す（プチッという音を防ぐため）
function leadSil(b){ // 音声の頭にある、ほぼ無音の部分の長さ(秒)を返す（MP3のエンコーダ遅延ぶんの無音もここで消える）
  const ch=[];let pk=0;
  for(let c=0;c<b.numberOfChannels;c++){const d=b.getChannelData(c);ch.push(d);for(let i=0;i<d.length;i++){const v=Math.abs(d[i]);if(v>pk)pk=v;}}
  if(pk<=0)return 0;
  const th=pk*SND_LEAD_RATIO;
  for(let i=0;i<b.length;i++){for(let c=0;c<ch.length;c++)if(Math.abs(ch[c][i])>th){const t=i/b.sampleRate-SND_LEAD_KEEP;return t>0&&t<b.duration*0.5?t:0;}}
  return 0;
}
// 音ごとの音量倍率（元の音声の大きさを測って、場面の重要度順にそろえた値。大きすぎる音は下げ、小さい音は上げる）。ここを変えれば個別に調整できる
const SND_GAIN={clink:1,boom:0.56,firework:0.74,tigiru:1.07,glassbreak:0.79,sasaru:9.5,shoot:0.26,reload:0.51};
const SND_PITCH=0.05; // 鳴らすたびに音程（と長さ）を±5%ずらす。同じ音の繰り返しで飽きないように。0にすると毎回同じ
let SND_LIM=null; // 音が重なって割れないようにする最後のリミッター
function b64buf(s){const b=atob(s.slice(s.indexOf(',')+1)),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer;}
function loadSnds(){
  if(!AC||!window.SOUNDS)return;
  for(const k of Object.keys(window.SOUNDS).sort((a,b)=>(b==='shoot')-(a==='shoot'))){ // 撃つ音を一番先に読み込む
    if(k in SND_BUF)continue;SND_BUF[k]=null;
    try{SND_PEND[k]=AC.decodeAudioData(b64buf(window.SOUNDS[k])).then(b=>{SND_BUF[k]=b;SND_OFF[k]=leadSil(b);}).catch(()=>{delete SND_BUF[k];});}catch(_){delete SND_BUF[k];}
  }
}
function playSnd(k,vol,rate){ // rate＝音程の倍率（省略＝1。大きいほど高く、短くなる）
  if(!AC||!save.sfx)return false;
  const b=SND_BUF[k];if(!b){loadSnds();return false;}
  try{
    if(!SND_LIM){SND_LIM=AC.createDynamicsCompressor();SND_LIM.threshold.value=-2;SND_LIM.knee.value=0;SND_LIM.ratio.value=20;SND_LIM.attack.value=0;SND_LIM.release.value=0.08;SND_LIM.connect(AC.destination);}
    const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;s.playbackRate.value=(rate||1)*(1+(Math.random()*2-1)*SND_PITCH);g.gain.value=(vol==null?1:vol)*(SND_GAIN[k]||1);s.connect(g);g.connect(SND_LIM);s.start(0,SND_OFF[k]||0);return true;
  }catch(_){return false;}
}
const SYNTH_SFX=true; // 合成音（sfx）のスイッチ。false にすると、音声ファイル（playSnd）以外は鳴らない
function sfx(f0,f1,dur,vol,type){
  if(!SYNTH_SFX||!AC||!save.sfx)return; // 設定で効果音がオフなら鳴らさない（ACは操作のあとにしか作られないので、saveの宣言前にここへ来ることはない）
  try{
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur);
  }catch(_){}
}
/* --- 金属に弾かれた「キーン」という音。整数倍でない倍音を重ねて、澄んだ余韻を残す。vol＝大きさ、pm＝音程の倍率（大きいほど高い）、ring＝余韻の長さの倍率 --- */
let PING_NZ=null;
function pingSfx(vol,pm,ring){
  if(!SYNTH_SFX||!AC||!save.sfx)return;
  try{
    const t=AC.currentTime,v=vol==null?0.35:vol,p=pm||1,r=ring||1;
    // [周波数の倍率, 大きさ, 余韻の秒数]：基音＋金属っぽい非整数倍音
    [[1,0.5,0.55],[2.76,0.28,0.35],[5.4,0.16,0.22]].forEach(([m,a,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();d*=r;
      o.type='sine';o.frequency.setValueAtTime(1700*p*m*1.015,t);o.frequency.exponentialRampToValueAtTime(1700*p*m,t+0.03); // 当たった瞬間だけ、わずかに高く
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(a*v,t+0.003);g.gain.exponentialRampToValueAtTime(0.001,t+d);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);
    });
    // 当たった瞬間のカチッという高い衝撃音
    if(!PING_NZ){const n=Math.floor(AC.sampleRate*0.03),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;PING_NZ=b;}
    const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=PING_NZ;fl.type='highpass';fl.frequency.value=4000;
    g.gain.setValueAtTime(0.5*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.03);
    s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t);
  }catch(_){}
}

/* --- 敵を壁に叩きつける音。bump.mp3だけを鳴らす（低音の合成音は重ねない）。k=衝撃の強さ0〜1、pm=音程の倍率（コンボで上がる）。強いほど大きく低い。bumpが読み込み前の間だけ、従来のドゴッ（合成音のみ）を鳴らす --- */
const SLAM_VOL=0.7; // この音全体の大きさ。ここで調整できる
const SLAM_BUMP=2; // bump.mp3 の大きさ。上げると大きく、下げると小さくなる
let SLAM_NZ=null;
function slamSnd(k,pm){
  if(!AC||!save.sfx)return;
  try{
    const t=AC.currentTime,V=(0.35+0.65*k)*SLAM_VOL,j=1+(Math.random()*2-1)*0.05,f=(1.3-0.6*k)*(pm||1)*j,bb=SND_BUF.bump;
    const tone=(type,f0,f1,d,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);};
    if(bb){
      const s=AC.createBufferSource(),g=AC.createGain();s.buffer=bb;s.playbackRate.value=(1.15-0.3*k)*(1+((pm||1)-1)*0.5)*j;g.gain.value=0.55*SLAM_BUMP*V;s.connect(g);g.connect(SND_LIM||AC.destination);s.start(t,SND_OFF.bump||0); // 鋭い当たり（頭の無音は読み込み時に測って飛ばす）
      return;
    }

    if(!SLAM_NZ){const n=Math.floor(AC.sampleRate*0.12),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;SLAM_NZ=b;}
    const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=SLAM_NZ;fl.type='lowpass';fl.frequency.value=900;g.gain.setValueAtTime(0.5*V,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t);
  }catch(_){}
}

function setStick(e){ // 基準点は親指の最初の位置。親指が離れすぎたら基準点が追いかけてくる（軸ごと）ので、切り返しは小さな動きで済む

const FB_DB_URL='https://railreel-default-rtdb.asia-southeast1.firebasedatabase.app'; // ←Realtime DatabaseのURLに書き換える（このままだと完全に無効）
const ST={D:null,db:null,bad:0,sec:0,plays:0,busy:false,up:false,conn:false,linking:false,retry:0};

async function stLink(want){ // 接続を、プレイ画面にいる間だけ保つ（初回だけSDKを読み込む。読めなければ30秒あけて再挑戦）
  if(ST.linking||Date.now()<ST.retry)return;
  ST.linking=true;
  try{
    if(want&&!ST.db){
      const [A,D]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js')]);
      ST.D=D;ST.db=D.getDatabase(A.initializeApp({databaseURL:FB_DB_URL}));
      D.onValue(D.ref(ST.db,'.info/connected'),sn=>{ST.conn=sn.val()===true;});
    }
    if(ST.db){if(want)ST.D.goOnline(ST.db);else ST.D.goOffline(ST.db);ST.up=want;}
  }catch(e){ST.retry=Date.now()+30000;}
  ST.linking=false;
}
async function stSend(){
  if(ST.busy||!ST.up||!ST.conn||(!ST.sec&&!ST.plays))return; // 接続できていない時は送らない（たまった分は次の機会に）
  ST.busy=true;
  const sec=Math.min(ST.sec,60),plays=Math.min(ST.plays,20);ST.sec=0;ST.plays=0; // 送れなかった分は捨てる（なくてもいい機能）
  try{
    const D=ST.D,w=[];
    if(sec)w.push(D.set(D.ref(ST.db,'stats/totalMinutes'),D.increment(sec/60)));
    if(plays)w.push(D.set(D.ref(ST.db,'stats/totalPlays'),D.increment(plays)));
    await Promise.race([Promise.all(w),new Promise((_,j)=>setTimeout(j,8000))]);
    ST.bad=0;
  }catch(e){ST.bad++;}
  ST.busy=false;
}

},1000);

    c.fillStyle=c2;for(const x of[-0.3,0.3]){c.beginPath();c.arc(r*x,0,7*BK,0,7);c.fill();}

      c.fillStyle=c1;
      for(let j=0;j<pal.n;j++){const a=j*Math.PI*2/pal.n,co=Math.cos(a),si=Math.sin(a),r0=ER-4;tri2(c,co*r0-si*9,si*r0+co*9,co*r0+si*9,si*r0-co*9,co*(ER+11),si*(ER+11));}
      c.fillStyle=c0;c.beginPath();c.arc(0,0,ER,0,7);c.fill();
      c.lineWidth=3;c.strokeStyle=c2;c.stroke();

    const r=BR;
    c.fillStyle=c1;
    for(let i=0;i<pal.n;i++){const a=i*Math.PI*2/pal.n+0.15,co=Math.cos(a),si=Math.sin(a),r0=r-5*BK;tri2(c,co*r0-si*10*BK,si*r0+co*10*BK,co*r0+si*10*BK,si*r0-co*10*BK,co*(r+12*BK),si*(r+12*BK));}

    c.lineWidth=4;c.strokeStyle=c2;c.stroke();
    c.globalAlpha=0.55;c.lineWidth=2;c.beginPath();c.arc(0,0,r*0.62,0,7);c.stroke();c.globalAlpha=1;
    c.fillStyle=c2;for(const y of[-0.3,0.3]){c.beginPath();c.arc(0,r*y,7*BK,0,7);c.fill();}

function burstCoins(C){ // 溜め終わり：敵が一斉に弾けてコインになる（枚数は貰える額に比例。敵の体の位置に小さいコインが出る）

  const wt=ty=>ty==='boss'||ty==='eboss'?3:1;let sw=0;for(const b of C.bodies)sw+=wt(b.label);
  const want=clamp(Math.round(lastGain/3),6,300),rb=clamp(8*k,5,10),coins=[];let sparkLeft=240;
  for(const b of C.bodies){

function startFly(C){ // 跳ね終わり：コインが所持金の表示へ飛んでいき、数字が増える。「+N」も出す

function star4(c,x,y,s){c.beginPath();c.moveTo(x,y-s);c.quadraticCurveTo(x,y,x+s,y);c.quadraticCurveTo(x,y,x,y+s);c.quadraticCurveTo(x,y,x-s,y);c.quadraticCurveTo(x,y,x,y-s);c.fill();}
function drawCoin2D(c,r,spin,tw){ // 縦軸まわりに回転する金貨（厚みつき）＋時々キラッと光る
  const cs=Math.cos(spin),sx=Math.max(0.14,Math.abs(cs)),sg=cs<0?-1:1;
  c.fillStyle='#a8731a';c.beginPath();c.ellipse(r*0.13*sg,0,r*sx,r,0,0,7);c.fill(); // 厚み
  c.fillStyle='#ffd24a';c.beginPath();c.ellipse(0,0,r*sx,r,0,0,7);c.fill();
  c.strokeStyle='#d99a22';c.lineWidth=Math.max(1,r*0.12);c.stroke();
  if(sx>0.35){c.save();c.scale(sx,1);c.lineWidth=Math.max(1,r*0.09);c.beginPath();c.arc(0,0,r*0.62,0,7);c.stroke();c.fillStyle='#d99a22';c.fillRect(-r*0.08,-r*0.3,r*0.16,r*0.6);c.restore();}

// 積もる敵の物理ボディ。ボスは見た目どおり「本体の円＋盾の板」、レーザーのボスは「本体の円＋砲台の円」の合体形。雑魚は円
function makePileBody(ty,x0,y0,k,r){
  const po={restitution:0.3,friction:0.7,frictionStatic:1},bo={label:ty,frictionAir:0.004,sleepThreshold:45,restitution:0.3,friction:0.7,frictionStatic:1};
  if(ty!=='boss'&&ty!=='eboss')return M.Bodies.circle(x0,y0,r,bo);
  const parts=[M.Bodies.circle(x0,y0,(BR+4)*k,po)]; // 本体（とげの少し内側まで）
  if(ty==='boss'){
    for(const side of[-1,1]){
      const{sx,sy,hx,hy}=shieldPts(BR,side);
      parts.push(M.Bodies.rectangle(x0+(sx+hx)/2*k,y0+(sy+hy)/2*k,Math.hypot(hx-sx,hy-sy)*k,2*SH_R*k,{...po,angle:Math.atan2(hy-sy,hx-sx)}));
    }
    // 二枚の盾の先端の間にできるV字のくぼみ（雑魚が挟まる）を、平らに埋める。くぼみは頂点(2r,0)・角(2r+SH_R,±√3·SH_R)の三角形で、これを含む長方形で塞ぐ
    parts.push(M.Bodies.rectangle(x0+(2*BR+SH_R/2)*k,y0,SH_R*k,2*SQ3*SH_R*k,po));
    // 本体と二枚の盾の内側にできる三角形の隙間（後ろ側が開いていて雑魚が入り込む）を、正三角形で丸ごと埋める。頂点は(2r,0)と(-r,±√3·r)
    parts.push(M.Bodies.polygon(x0,y0,3,2*BR*k,{...po,angle:Math.PI}));
  }else{
    for(let i=0;i<2;i++){const t=turretPos(i);parts.push(M.Bodies.circle(x0+t.x*k,y0+t.y*k,(TURR+4)*k,po));}
  }
  const b=M.Body.create({...bo,parts});
  b.dOff={x:x0-b.position.x,y:y0-b.position.y}; // 合体すると位置が重心に動くので、絵を描く原点（本体の中心）との差を覚えておく
  return b;
}

  /* --- トゲ地帯（壁の一部）：強化で増える。重なった所は強くなるされて強くなる。自機にはダメージなし --- */
  /* --- トゲ地帯は「区画」方式：壁を約13pxの区画に区切り、区画ごとに強さ(p)を持つ。取ったトゲは範囲内の区画に入り、すでにトゲのある区画は強くなる --- */
  ensureCells(){ // 区画の数はSPK_Nで固定。壁の形が変わっても数は変えず、一区画の長さ（壁一周÷SPK_N）だけが変わる
    if(this.cells&&this.cells.length===SPK_N)return;
    this.cells=Array.from({length:SPK_N},()=>({p:0,fl:0,tx:0,g:null})); // tx＝砲台のトゲのせり出し具合(0〜1)、g＝区画の形（壁の位置と向き）
  }
  addSpike(p0){

    const P=this.wp.P,N=this.cells.length,cw=P/N;
    const k=Math.min(N-1,Math.max(SPK_NMIN,SPK_N0-SPK_N1*(p0-1))),first=Math.floor(Math.random()*N)-Math.floor(k/2); // 範囲の区画数と、ランダムな開始位置
    for(let t=0;t<k;t++){
      const c=this.cells[((first+t)%N+N)%N];
      if(c.p>0)c.p=Math.min(SPK_PMAX,c.p+p0); // 重なった区画：足し合わせる（同じ色が2つで次の色）
      else c.p=p0;
      c.fl=1;
    }
    this.buildSpk();
  }
  buildSpk(){ // 区画ごとの形（壁の位置と向き）を作り直す。三角形そのものは描くときに作る（砲台のトゲの高さが動くため）
    const w=this.wp,cs=this.cells;if(!w||!cs)return;
    const cw=w.P/cs.length;this.blank=cornerCells(w,cs.length); // 角の区画は空白（強さは残るので、角をまたいだ塊はその先からまた続く）
    for(let i=0;i<cs.length;i++){
      const c=cs[i];if(this.blank[i]){c.g=null;continue;}
      const q=pathAt(w,(i+0.5)*cw);

    }
  }
  turN(){return this.eq()==='spike'?1:0;} // トゲ砲台を装備していれば1（ショップで買う砲台）
  spkEff(i){ // 区画iの今の強さ＝壁のトゲ＋砲台のトゲ（足し合わせ）。砲台のトゲだけの区画は、半分以上せり出してから当たる
    const c=this.cells[i];if(!c||(this.blank&&this.blank[i]))return 0;

  }
  stepTurret(dr){ // トゲ砲台（装備中のみ）：自分の位置の区画と左右13区画のトゲをせり出し、離れた区画は沈める（ゆっくり）
    if(this.turN()>0&&!this.cells){this.ensureCells();this.buildSpk();} // 砲台を装備していれば、壁のトゲがなくても区画を用意する
    const cs=this.cells,w=this.wp;if(!cs||!w)return;
    const T=this.turN(),N=cs.length;let ci=-1;
    if(T>0){const q=at(this.s);let bi=0,bd=1e9;for(let i=0;i<w.pts.length;i++){const d=(w.pts[i].x-q.x)*(w.pts[i].x-q.x)+(w.pts[i].y-q.y)*(w.pts[i].y-q.y);if(d<bd){bd=d;bi=i;}}ci=Math.floor(w.cum[bi]/(w.P/N))%N;}
    for(let i=0;i<N;i++){

  drawSpikes(g){

      const lv=spkLv(pe),hh=(14+Math.min(lv,5)*3)*(c.p>0?1:c.tx),tx=t.mx+t.nx*hh,ty=t.my+t.ny*hh;
      const pul=lv>=3?0.1*Math.sin(now/180+i*0.15):0;

  spikeAt(x,y){ // (x,y)が触れているトゲの区画（なければnull）。{p:強さ, idx:区画の番号}
    const w=this.wp,cs=this.cells;if(!w||!cs||!cs.some((c,i)=>this.spkEff(i)>0))return null;

    this.freeze=Math.max(this.freeze,0.08+0.02*p);this.punch=Math.max(this.punch,0.16+0.03*p);

  /* --- 目玉の敵：ゆっくり漂い、体全体が一つの目として光線を撃つ（光線は壁で跳ね返る） --- */

  /* --- ロングビームの敵：漂う→溜める→その場に固定され、振動しながら長いビームを撃つ。撃っている間に銛が刺さると、ビームはパッと光って消える --- */

  shootBeam(ang,owner,org,opt){ // 黒目から角度angの向きへ光線を撃つ。出ている間(emit)は尾が黒目につながったまま伸びる。opt＝{sp:速さ,emit:出続ける時間,col:色,hc:当たった点の色,snd:音を変える}

  beamWillHit(b,q){ // 光線の頭がこのまま進むと、SLOW_AHEAD秒以内に自機へ当たるか（壁の跳ね返りも考慮。自機は今の位置で判定）

      for(let j=1;j<=m;j++){

  /* --- 光線の1ステップ（目玉の敵・新ボス共通） --- */
  stepBeams(q){
    const p=q.p;
    for(let i=this.bul.length-1;i>=0;i--){
      const b=this.bul[i];b.t+=STEP;
      if(b.dy!==undefined){b.dy-=STEP;if(b.dy<=0)this.bul.splice(i,1);continue;} // 銛で消される光線：その場で光って、当たり判定もなく消える
      if(b.hit)b.hit.t+=STEP;
      if(b.emit>0){ // 黒目から出ている間：尾は黒目に固定、火花が散る
        b.emit-=STEP;
        const o=b.org();
        if(!o||b.n>EYE_BN)b.emit=0;
        else{b.h[0].x=o.x;b.h[0].y=o.y;this.sparkE.explode(2,o.x,o.y);}
        if(b.emit<=0){ // 出終わり：その時点の長さのまま尾が黒目を離れる
          b.emit=0;let ln=0,px=b.x,py=b.y;

        for(let a=1;a<P.length&&!hit;a++){

  /* --- 迫る向き：直線レールでは、遠いほど自機の上方を狙い（漏斗状）、近づくほど自機そのものを狙う。他の形のレールでは自機そのもの --- */

  /* --- 敵の1ステップ --- */
  pickFocus(){ // 狙い・表示の対象：銛が刺さっている敵、なければ自機に一番近い敵
    if(!this.es.length){this.e=null;return;}
    const h=this.h;if(h&&h.st==='stuck'&&this.es.includes(h.tg)){this.e=h.tg;return;}
    const p=at(this.s);
    const ok=this.es.filter(e=>!(e.type==='clam'&&e.shell&&e.cs!=='dash'&&e.cs!=='tele')); // 貝（シールドが残っているもの）は、突進の予告中と突進中だけ狙う
    const pool=ok.length?ok:this.es; // 狙える敵がいなければ（貝だけ残った時など）全員から選ぶ

  stepEnemy(q){ // 敵を全員1ステップ進める（1体ずつ this.e に入れ替えて処理）
    const N=this.es.length;this.atkC=N/(1+ENEMY_ATK_K*(N-1)); // 攻撃の間隔を伸ばす倍率（1体なら1）。全体の攻撃頻度を、体数ほどは増やさないため
    const add=STEP*(1-1/this.atkC);

  stepOne(q){

  /* --- 引いている敵が、辺に沿って横から自機の側面に滑り込んで当たらないよう、引く先を辺から離れる向き（手前側）へずらす。正面から引く時は何もしない --- */
  liftTarget(q,e,T){
    const p=q.p,ex=e.x-p.x,ey=e.y-p.y,ln=ex*q.nx+ey*q.ny,ly=Math.abs(ex*p.tx+ey*p.ty);

  /* --- 物理（敵本体・ちぎれた盾で共通）：巻き取り・移動・ロープ拘束・壁バウンド --- */

      const rx=T.x-e.x,ry=T.y-e.y,rc=rx*ny-ry*nx,kf=1/(1+rc*rc/EIo); // 紐がつながっている点の腕の長さ（巻き取りと同じ：力は重心ではなく、つながっている点にかかる）
      if(this.tugKick){const a=TUG_I*kf;e.vx+=nx*a;e.vy+=ny*a;e.w=clamp(e.w+rc*a/EIo,-20,20);o.tugBt=TUG_BDELAY;} // 引くたびに、つながっている点がグッと自機側へ寄る
      if(o.tugBt>0){o.tugBt-=STEP;if(o.tugBt<=0)o.tugBk=TUG_BACK;} // 少し遅れて、敵側へ引き戻される
      o.tugBk=(o.tugBk||0)*Math.exp(-TUG_BDECAY*STEP);
      o.tugPh=(o.tugPh||0)+STEP;const pw=TUG_V*(1+TUG_SURGE*Math.sin(o.tugPh*Math.PI*2/TUG_PERIOD)); // 力に強弱の周期をつけて、グイグイ引く
      const vr=e.vx*nx+e.vy*ny,dv=(-(pw+o.tugBk)-vr)*(1-Math.exp(-TUG_K*STEP));
      e.vx+=nx*dv;e.vy+=ny*dv; // ボス自身が逃げる力は重心にかかる
      e.w=clamp(e.w+rc*TUG_TQ*(pw+o.tugBk)*STEP/EIo,-20,20); // 紐の張力は、つながっている点を自機側へ引く：その点が手前に来るように、ボスが回る
      {const pp=q.p,pt=-(nx*pp.tx+ny*pp.ty);this.vel+=pt*TUG_PL*(pw+o.tugBk)*STEP;if(this.tugKick)this.vel+=pt*TUG_PK;} // 反動：ボスが紐を引くと、自機もレールに沿ってボス側へ引かれる（互いに引っ張り合う）
    }
    // 巻き取り：敵を支点に向けて加速
    if(this.reeling&&st&&!tug){
      const T=this.tail(),LT=this.liftTarget(q,e,T),dx=LT.x-T.x,dy=LT.y-T.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;
      const rx=T.x-e.x,ry=T.y-e.y,rc=rx*ny-ry*nx; // 接続点の腕の長さ（トルク用。てこの長さ）
      const vr=e.vx*nx+e.vy*ny+e.w*rc;
      const kk=(o.tut?(this.demo?DEMO_PULL_K:TUT_PULL_K):REEL_MAX*this.pullM)*(o.type==='boss'&&o.arms.some(a=>a.alive)?BRACE:1); // 盾がある間のボスは踏ん張る
      if(vr<PULLMAX*kk){const a=Math.min(PULLA*kk*STEP,PULLMAX*kk-vr)/(e.m||1)/(1+rc*rc/EIo);e.vx+=nx*a;e.vy+=ny*a;e.w=clamp(e.w+rc*a/EIo,-20,20);}
    }
    // 移動
    const dm=Math.exp(-(e.tut&&!this.demo&&this.tp!=='pull'&&this.tp!=='move'?1.6:0.5)*STEP);e.vx*=dm;e.vy*=dm; // チュートリアルの敵は、引く間だけ実際のプレイと同じ減衰（それ以外は勢いがすぐ収まる）。見本は引いた後も実際のプレイと同じ減衰で、勢いを保ったまま壁へ飛ぶ
    const sp=Math.hypot(e.vx,e.vy);if(sp>1400){e.vx*=1400/sp;e.vy*=1400/sp;}
    e.x+=e.vx*STEP;e.y+=e.vy*STEP;

    if(st){
      const T=this.tail(),dx=T.x-q.pvx,dy=T.y-q.pvy,d=Math.hypot(dx,dy)||1;
      if(this.reeling&&!tug)this.ropeLen=Math.min(this.ropeLen,d);
      else if(this.tautT>0)this.ropeLen=Math.min(this.ropeMax||RMAX,d); // 引いた直後：紐は距離にぴったり合わせて張ったまま。敵が離れる動きは邪魔せず、紐が一緒に伸びていく（壁で跳ね返った敵を引き戻さない）

      if(d>this.ropeLen){ // 上限を超えたぶんは、バネのように徐々に引き戻す（ぐーっと伸びて戻る）。位置は飛ばさない
        const nx=dx/d,ny=dy/d,c=d-this.ropeLen;

        e.vx-=nx*A*STEP;e.vy-=ny*A*STEP;e.w=clamp(e.w-rc*A*STEP/EIo,-20,20);
        if(vr>380&&this.yankC<=0){

        }

    for(let it=0;it<3;it++){

      e.x-=w.nx*w.pen;e.y-=w.ny*w.pen;
      const vn=e.vx*w.nx+e.vy*w.ny;

        e.vx-=(1+this.rest)*vn*w.nx;e.vy-=(1+this.rest)*vn*w.ny;
        const jt=(Math.random()-0.5)*vn*0.35;e.vx+=-w.ny*jt;e.vy+=w.nx*jt;
        e.w=clamp(e.w+(Math.random()-0.5)*vn/e.r*0.9,-14,14);
        this.wallHit(e.x+w.nx*e.r,e.y+w.ny*e.r,vn,e,w);
        if(e.dead)return;
      }
    }
  }

  /* --- 貝の行動：閉じて漂い、予告のあと、シールドをパクパクさせながらまっすぐ突進 --- */
  clamAI(q,e,st){
    e.sf*=Math.exp(-9*STEP);
    if(!e.shell){ // シールドが砕けた後の本体：ふらふら漂うだけ
      e.next-=STEP;
      if(e.next<=0){e.next=rnd(1.0,2.0);const a=rnd(0,6.283),sp=100*(st?0.4:1);e.vx+=Math.cos(a)*sp;e.vy+=Math.sin(a)*sp;}
      return;
    }
    const dx=q.p.x-e.x,dy=q.p.y-e.y;let diff=Math.atan2(dy,dx)-e.a;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
    if(e.cs==='idle'){ // 閉じたまま、ゆっくり自機の方へ向き直る
      e.w=0;e.a+=diff*Math.min(1,1.5*STEP);e.open*=Math.exp(-14*STEP);e.vx*=Math.exp(-3*STEP);e.vy*=Math.exp(-3*STEP); // 突進のあとはブレーキ
      e.next-=STEP;
      if(e.next<=0){
        if(Math.random()<0.5){e.cs='tele';e.tele=e.teleMax;sfx(300,600,0.2,0.25,'square');}
        else{e.next=rnd(0.8,1.6);const a=rnd(0,6.283),sp=110;e.vx+=Math.cos(a)*sp;e.vy+=Math.sin(a)*sp;}
      }
    }else if(e.cs==='tele'){ // 予告：自機の方へ素早く向き、シールドが小刻みに震える
      e.w=0;e.a+=diff*Math.min(1,10*STEP);e.vx*=0.9;e.vy*=0.9;
      e.open=0.06*Math.abs(Math.sin(e.tele*70));
      e.tele-=STEP;
      if(e.tele<=0){e.cs='dash';e.ct=CL_DT;e.cp=0;sfx(160,520,0.28,0.3,'sawtooth');}
    }else if(e.cs==='rise'){ // レールに当たったあと：シールドを閉じて、一旦上の方（画面の上＝自機から離れる向き）へ上がる
      e.w=0;e.open*=Math.exp(-14*STEP);e.a+=diff*Math.min(1,3*STEP);e.ct-=STEP;

      const k=Math.min(1,6*STEP);e.vx+=(ux*CL_RISE_V-e.vx)*k;e.vy+=(uy*CL_RISE_V-e.vy)*k;
      if(e.ct<=0){e.cs='idle';e.next=rnd(1.0,1.8);}
    }else{ // 突進：向きは変えず、まっすぐ。パクパクと開閉する

      const sp=CL_DASH+12*Math.min(this.stage,20);e.vx=Math.cos(e.a)*sp;e.vy=Math.sin(e.a)*sp;
      if(e.ct<=0){e.cs='idle';e.next=rnd(1.6,2.6);}
    }
  }

  /* --- ボスの行動：自機の方を向き、盾で守りながらゆっくり迫り、予告つきで突進 --- */
  bossAI(q,e,st){
    const dx=q.p.x-e.x,dy=q.p.y-e.y,d=Math.hypot(dx,dy)||1,armed=e.arms.some(a=>a.alive);
    for(const ar of e.arms){if(ar.alive){ar.tear=Math.max(0,ar.tear-TEAR_DECAY*STEP);ar.flash=Math.max(0,ar.flash-4*STEP);}}
    { // 盾が一枚だけ残ったら、くるっと回って正面に来る（少し行き過ぎてから戻る）
      const left=e.arms.filter(a=>a.alive).length,hh=this.h;
      for(let i=0;i<e.arms.length;i++){
        const ar=e.arms[i];if(!ar.alive)continue;
        const old=ar.rot||0;ar.rotT=left===1?-(i?1:-1)*Math.PI/3:0;
        ar.rv=((ar.rv||0)+(ar.rotT-old)*180*STEP)*Math.exp(-14*STEP);ar.rot=old+ar.rv*STEP;
        const d=ar.rot-old;
        if(d&&hh&&hh.st==='stuck'&&hh.tg===e&&hh.arm===i){ // 刺さっている銛も、盾と一緒に回る
          const c=Math.cos(d),sn=Math.sin(d),ox=hh.offT.x,oy=hh.offT.y;
          hh.offT={x:ox*c-oy*sn,y:ox*sn+oy*c};hh.rel+=d;
        }
      }
    }
    if(e.sp>0){this.spinStep(e,q);e.w=0;return;} // 盾の回転攻撃中：本体は回らず、ゆっくり動く
    let diff=Math.atan2(dy,dx)-e.a;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
    const want=clamp(diff*2.2,-1.1,1.1)*(armed?1:1.35)*(st?0:1); // 銛が刺さっている間は、自分から自機の方へ向き直らない（刺さった点が手前に来る回転を邪魔しない）
    e.w+=(want-e.w)*Math.min(1,4*STEP);
    if(e.tele>0){
      e.tele-=STEP;e.vx*=0.9;e.vy*=0.9;
      if(e.tele<=0){const sp=armed?430:640;e.vx=dx/d*sp;e.vy=dy/d*sp;sfx(160,480,0.26,0.25,'sawtooth');}
    }else if(e.drift>0){e.drift-=STEP; // ちぎられて漂っている間は、迫らず突進も始めない
    }else{
      const ac=(armed?55:95)*(st?0.3:1)*STEP,aim=this.aimDir(q,e);e.vx+=aim.dx/aim.d*ac;e.vy+=aim.dy/aim.d*ac; // じわじわ迫る（直線レールでは斜め上から）

      if(e.next<=0){

      }
    }
  }

  /* --- ボスの盾の回転攻撃：盾をバッと左右に開き（銛は払われ、盾には刺さらなくなる）、二枚で一本の棒になって本体を中心にゆっくり回りながら動く。この間は本体を狙える。本体に銛を打ち込むと割れて回転が止まり、元の構えに戻る（盾がある間、本体には刺さらない） --- */
  startSpin(e){
    e.sp=1;e.spT=0;e.spK=0;e.spA=0;e.spN=0;e.tele=0;
    const h=this.h,cam=this.cameras.main;
    if(h&&h.st==='stuck'&&h.tg===e){ // 刺さっていた銛は払われる
      const T=this.tail();
      h.ang=h.rel+e.a;h.dvx=-h.ux*this.spd*0.25;h.dvy=-h.uy*this.spd*0.25;h.dw=rnd(-5,5);h.trail.length=0;
      this.jerkT=0;this.reeling=false;h.st='drift';h.tg=null;
      this.hitE.explode(14,T.x,T.y);
    }
    for(const x of this.ex)if(x.h.st==='stuck'&&x.h.tg===e){x.h.st='back';x.h.trail.length=0;} // 左右の銛も払われる
    cam.shake(140,0.008);sfx(200,700,0.18,0.3,'sawtooth');sfx(900,300,0.1,0.2,'square');
  }
  spinStep(e,q){
    if(e.sp===1){ // 盾をバッと開く
      e.spT+=STEP;const t=Math.min(1,e.spT/SPN_OPEN);e.spK=1-Math.pow(1-t,3);
      if(t>=1){e.sp=2;e.spT=0;e.spK=1;}
    }else if(e.sp===2){ // 回転しながら、ランダムな方向へゆっくり移動
      e.spT+=STEP;e.spA+=SPN_W*(e.arms.filter(a=>a.alive).length===1?SPN_ONE:1)*STEP;e.spN-=STEP; // 盾が残り1枚なら回転が速い
      
      {const aim=this.aimDir(q,e);e.spvx=aim.dx/aim.d*SPN_V;e.spvy=aim.dy/aim.d*SPN_V;} // ランダムではなく、常に自機の方へ向かって動く
      const k=Math.min(1,2*STEP);e.vx+=((e.spvx||0)-e.vx)*k;e.vy+=((e.spvy||0)-e.vy)*k;
      if(e.spT>=SPN_MAX)this.spinEnd(e);
    }else{ // 回転が止まって、すっと元の構えに戻る
      e.spT+=STEP;const t=Math.min(1,e.spT/SPN_CLOSE),u=t*t*(3-2*t);
      e.spK=1-u;e.spA=e.spA0*e.spK;
      if(t>=1){e.sp=0;e.spK=0;e.spA=0;e.next=rnd(2.8,4.2);}
    }
  }
  spinEnd(e){e.sp=3;e.spT=0;e.spA0=Math.atan2(Math.sin(e.spA),Math.cos(e.spA));} // 回転を止めて、元に戻り始める
  spinBreak(e){ // 本体に銛が刺さった：割れたようなエフェクトと共に回転がストップ
    this.spinEnd(e);
    const cam=this.cameras.main;
    for(let i=0;i<36;i++){
      const a=rnd(0,6.283),r0=rnd(0.3,1)*e.r,sp=rnd(220,640),cc=Math.random();
      this.shards.push({x:e.x+Math.cos(a)*r0,y:e.y+Math.sin(a)*r0,vx:Math.cos(a)*sp+e.vx*0.4,vy:Math.sin(a)*sp+e.vy*0.4,a:rnd(0,6.283),w:rnd(-22,22),t:0,c:cc<0.5?0xffffff:cc<0.8?0xcfe8ff:0x66e0ff});
    }
    this.imps.push({x:e.x,y:e.y,t:0,s:1.3,fill:1},{x:e.x,y:e.y,t:0,s:2.4,c:0x66e0ff});
    this.hitE.explode(24,e.x,e.y);cam.shake(220,0.014);this.softFlash(110,220,245,255,0.35);this.punch=Math.max(this.punch,0.12);
    if(!playSnd('glassbreak',1)){sfx(3400,900,0.1,0.35,'square');sfx(5200,1800,0.07,0.28,'triangle');sfx(2000,300,0.25,0.25,'sawtooth');} // 盾ボスの回転攻撃を、本体に銛を当てて止めた音：glassbreak（読み込み前だけ合成音）
  }

  /* --- ボスの盾の位置（本体の座標系：本体の円を内接円とする正三角形の、前側の二辺。前の頂点→後ろの頂点） --- */
  armGeo(e,i){
    if(e.kind==='eyes'){const t=turretPos(i),c=Math.cos(e.a),s=Math.sin(e.a),x=e.x+t.x*c-t.y*s,y=e.y+t.x*s+t.y*c;return{sx:x,sy:y,hx:x,hy:y,mx:x,my:y,ang:e.a};} // 砲台（点）
    const side=i?1:-1,c=Math.cos(e.a),s=Math.sin(e.a),r=e.r;
    const{sx,sy,hx,hy}=armPtsE(e,i);
    const S={x:e.x+sx*c-sy*s,y:e.y+sx*s+sy*c},H={x:e.x+hx*c-hy*s,y:e.y+hx*s+hy*c};
    return{sx:S.x,sy:S.y,hx:H.x,hy:H.y,mx:(S.x+H.x)/2,my:(S.y+H.y)/2,ang:e.a+Math.atan2(hy-sy,hx-sx)};
  }

  /* --- 銛の先端が何かに当たったか（盾・ちぎれた盾・本体）。刺さる／弾かれるなら true --- */
  probe(tx,ty){
    for(const pc of this.pieces){
      if(Math.hypot(tx-pc.x,ty-pc.y)<pc.r+2){this.embed(tx,ty,pc);return true;}
    }
    for(const e of this.es)if(this.probeE(tx,ty,e))return true;
    return false;
  }
  probeE(tx,ty,e){
    if(e.dead)return false;
    if(e.type==='clam'&&e.shell){ // 貝：シールドには弾かれる。割れて見えている本体にだけ刺さり、刺さるとシールドが砕け散る
      const c=Math.cos(e.a),sn=Math.sin(e.a),dx=tx-e.x,dy=ty-e.y,lx=dx*c+dy*sn,ly=-dx*sn+dy*c;
      if(Math.abs(lx)>2*CL_S+10||Math.abs(ly)>2*CL_S+10)return false;
      if(this.clamPlateHit(e,lx,ly)){e.sf=1;this.deflect(tx,ty,1.25,true);return true;}
      if(Math.hypot(lx,ly)<CL_B+3){this.embed(tx,ty,e);this.shatterShell(e);return true;}
      return false;
    }
    if(e.type==='boss'){
      for(let i=0;i<e.arms.length;i++){
        if(!e.arms[i].alive)continue;
        const g=this.armGeo(e,i);
        if(dseg(tx,ty,g.sx,g.sy,g.hx,g.hy)<armR(e)+8){if(e.sp>0)this.deflect(tx,ty,1.25,true);else this.embed(tx,ty,e,i);return true;} // 回転攻撃中は、盾に刺さらず弾かれる
      }
      if(Math.hypot(tx-e.x,ty-e.y)<e.r+2){
        if(e.sp===1||e.sp===2){this.spinBreak(e);this.deflect(tx,ty,1.25,true);return true;} // 回転攻撃中に本体へ当てると、回転が止まる（刺さりはせず弾かれる）
        if(e.arms.some(a=>a.alive)){this.deflect(tx,ty,1.25,true);return true;}
        this.embed(tx,ty,e);return true;
      }
      return false;
    }
    if(Math.hypot(tx-e.x,ty-e.y)<e.r+2){this.embed(tx,ty,e);return true;}
    return false;
  }
  clamPlateHit(e,lx,ly){ // 割れた貝の二枚の板に当たっているか（蝶番は後ろ中央。点を蝶番まわりに逆回転して、元の板の中で判定）
    const M=2,op=e.open||0;
    for(const sg of[-1,1]){
      const al=sg*op,ca=Math.cos(al),sa=Math.sin(al),rx=lx+CL_S,ry=ly,x=rx*ca+ry*sa,y=-rx*sa+ry*ca;
      if(x>=-M&&x<=2*CL_S+M&&(sg<0?(y>=-CL_S-M&&y<=3):(y>=-3&&y<=CL_S+M)))return true;
    }
    return false;
  }
  shatterShell(e){ // 攻撃中に本体へ銛が刺さって、シールドが砕け散る。残るのは脆い本体だけ
    e.shell=false;e.cs='idle';e.open=0;e.tele=0;e.r=CL_B+5;e.hp=e.max=CL_HP;e.next=1;

    for(let i=0;i<64;i++){

  tearArm(e,i){ // 盾がちぎれて飛んでいく（銛はそのまま盾に刺さっている）
    const ar=e.arms[i],g=this.armGeo(e,i),h=this.h,cam=this.cameras.main,q=this.gp();
    ar.alive=false;ar.tear=0;
    const eyes=e.kind==='eyes',rr=eyes?TURR+6:PC_R,hp=40+4*this.stage;
    const pc={isPiece:true,type:eyes?'turret':'arm',r:rr,m:1,I:rr*rr*2,L:eyes?PC_L:Math.hypot(g.hx-g.sx,g.hy-g.sy)/2,x:g.mx,y:g.my,a:g.ang,vx:0,vy:0,w:rnd(-6,6),hp,max:hp,flash:1,t:0,dead:false};
    const p=q.p,dx=p.x-pc.x,dy=p.y-pc.y,d=Math.hypot(dx,dy)||1;
    pc.vx=dx/d*820+e.vx*0.3;pc.vy=dy/d*820+e.vy*0.3; // 紐に引かれて自機の方へ飛ぶ
    if(h&&h.st==='stuck'&&h.tg===e&&h.arm===i){ // 銛を盾の破片につなぎ替える（もぎ取っても銛は外れない）
      h.sl=LEN;const T=this.tail(),ang=h.rel+e.a,lx=T.x-pc.x,ly=T.y-pc.y,c=Math.cos(pc.a),s=Math.sin(pc.a);

      let ux=e.x-p.x,uy=e.y-p.y;const ud=Math.hypot(ux,uy);
      if(ud<1e-3){ux=-dx/d;uy=-dy/d;}else{ux/=ud;uy/=ud;}

    }

    if(eyes){this.note(e.arms.some(a=>a.alive)?'Turret ripped off! Slam it into the wall!':'ARMOR BREAK!! Body exposed');} // 砲台のボス（撃破は本体を叩きつけて）
    else{
    this.note(e.arms.some(a=>a.alive)?'Shield ripped off! Slam it into the wall!':'ARMOR BREAK!! Body exposed');
    if(!e.arms.some(a=>a.alive))e.next=Math.min(e.next,0.9);

  breakPiece(pc,silent){ // ちぎれた盾が壊れる

  stepPiece(pc,q){
    pc.t+=STEP;

    this.stepBody(pc,q);
    if(pc.dead)return;
    // ちぎれたパーツ（盾・砲台）は自機にダメージを与えない。自機に当たると壊れる（判定の取り方はボスの盾と同じ）
    const p=q.p,mx=p.x+q.nx*9.5,my=p.y+q.ny*9.5;
    const hit=pc.type==='turret'?Math.hypot(mx-pc.x,my-pc.y)<pc.r+11
      :dseg(mx,my,pc.x-Math.cos(pc.a)*pc.L,pc.y-Math.sin(pc.a)*pc.L,pc.x+Math.cos(pc.a)*pc.L,pc.y+Math.sin(pc.a)*pc.L)<SH_R+17;

  /* --- 散弾の左右の銛：本体と同じ処理（stepHarpoon）をそのまま使う。this.h・this.rope・this.ropeLen を一時的に差し替えて呼ぶだけ。
         1本でも刺さったら、それが本体になり、残り（元の本体を含む）は紐ごと引き込まれる。真ん中は先に処理されるので、同時なら真ん中が優先 --- */
  stepExtras(q){
    if(!this.ex.length)return;
    if(this.h.st==='stuck'||this.h.st==='back')for(const x of this.ex)if(x.h.st!=='back'){x.h.st='back';x.h.trail.length=0;} // 本体が刺さった・戻る時は、左右も戻る
    for(const x of this.ex.slice()){
      const sv={h:this.h,rope:this.rope,rl:this.ropeLen,re:this.reeling,tz:this.taut};
      this.h=x.h;this.rope=x.rope;this.ropeLen=x.rl;this.inEx=true;
      this.stepHarpoon(q);
      this.inEx=false;
      x.taut=this.taut; // この銛の紐が張っているか（描画の色に使う。本体の値は下で元に戻す）
      x.h=this.h;x.rope=this.rope;x.rl=this.ropeLen; // 戻りきって catchH が呼ばれると x.h は null
      this.h=sv.h;this.rope=sv.rope;this.ropeLen=sv.rl;this.reeling=sv.re;this.taut=sv.tz;
      if(!x.h){this.ex=this.ex.filter(o=>o!==x);continue;}
      if(x.h.st==='stuck'){ // この銛が刺さった：本体を入れ替え、元の本体と残りは引き込む
        this.ex=this.ex.filter(o=>o!==x);
        this.ex.push({h:this.h,rope:this.rope,rl:this.ropeLen,taut:sv.tz});
        this.h=x.h;this.rope=x.rope;this.ropeLen=x.rl;this.taut=x.taut; // 刺さった銛が本体になる（引く・巻く・火花の演出は本体の銛に対して働く）
        for(const o of this.ex){o.h.st='back';o.h.trail.length=0;}
        return;
      }
    }
  }
  drawHarp(g,q,h,rope,main,taut,part){ // 紐と銛を描く（本体も左右の銛も同じ）。紐の張り・巻き取りの表現は本体だけ。part＝'rope'なら紐だけ・'harp'なら銛だけ（省略なら両方）
    const rl=main&&this.reeling,tz=main?this.taut:taut;
    // ロープ（たるむと暗く細く、張ると明るく太く、巻き取り中はオレンジ）
    if(rope&&part!=='harp'){
      const r=rope,pn=rl?(rl?1:0):0;
      const col=rl?((255<<16)|(Math.round(179-128*pn)<<8)|Math.round(71+14*pn)):(tz?0xffe6a8:0x8ea0c8);
      const sk=main&&this.snapT>0&&h?this.snapT/0.25:0; // 引いた直後は、実際に張った紐そのものを一瞬白く太く描く
      if(sk>0)g.lineStyle(8+10*sk,sk>0.4?0xffffff:0xffe6a8,1);
      else g.lineStyle(rl?6+10*pn:(tz?8:5),col,tz?1:0.85);
      const fuse=main&&h&&h.st==='stuck'&&h.fz&&!rl&&!(sk>0); // 花火で刺さっている間（引いた直後・巻き取り中の演出は優先）
      if(fuse){
        const fzz=h.fz,draw=(pts,w,c,al)=>{if(pts.length<2)return;g.lineStyle(w,c,al);g.beginPath();g.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)g.lineTo(pts[i].x,pts[i].y);g.strokePath();};
        if(fzz.w>0){const u=1-fzz.w/FW_GAP;draw(r,6+2*u,lerpC(0x7c8296,0xffe6a8,u),0.95+0.05*u);} // 花火のあとの間隔：灰色から、徐々に導火線の黄色に戻っていく
        else{
          const [burnt,fresh]=polySplit(r,fzz.d);
          draw(burnt,6,0x7c8296,0.95);   // 燃えたあと＝灰色
          draw(fresh,8,0xffe6a8,1);      // まだ燃えていない＝黄色
        }
      }else{
        g.beginPath();g.moveTo(r[0].x,r[0].y);
        for(let i=1;i<r.length;i++)g.lineTo(r[i].x,r[i].y);
        g.strokePath();
      }
      if(sk>0){g.lineStyle(3,0xffffff,sk);g.strokeCircle(h.b.x,h.b.y,10+50*(1-sk));} // 先端の衝撃リング
    }
    // 銛
    if(h&&part!=='rope'&&!(h.home&&h.st==='back')){
      const n=h.trail.length;
      for(let i=1;i<n;i++){g.lineStyle(3*i/n,0xffb347,0.6*i/n);g.lineBetween(h.trail[i-1].x,h.trail[i-1].y,h.trail[i].x,h.trail[i].y);}
      let ang;
      if(h.st==='fly')ang=Math.atan2(h.uy,h.ux);
      else if(h.st==='drift')ang=h.ang;
      else if(h.st==='stuck'&&h.tg)ang=h.rel+h.tg.a;
      else ang=Math.atan2(h.b.y-q.pvy,h.b.x-q.pvx);
      g.save();g.translateCanvas(h.b.x,h.b.y);g.rotateCanvas(ang);
      const L=h.st==='stuck'?Math.max(1,h.sl):LEN; // 刺さっている間は、縮んだ判定の長さのまま描く
      this.harpoon(g,L,this.eq()==='bomb'&&!h.bd,this.eq()==='firework'); // 爆弾：爆発するまでは先端近くに刺さっている（h.bd＝爆発して取れた）
      if(h.st==='stuck'){ // 砕ける前触れ：最後は白く点滅（ひびの線は描かない）
        const k=h.stT/this.stuckT;
        if(k>0.75&&Math.floor(h.stT*(10+30*(k-0.75)*4))%2){g.fillStyle(0xffffff,0.55);g.fillRoundedRect(-2,-13,L+8,26,6);}
      }
      g.restore();
    }
    if(main&&h&&h.st==='stuck'&&h.fz&&!(h.fz.w>0)&&rope&&part!=='harp'){ // 花火：導火線の先頭で火花が光る（紐と一緒に描く）（大きさは一定）
      const f=h.fz,pw=fwPow(f.t),sz=FW_S0+(FW_SMAX-FW_S0)*pw,P=this.fuseXY(h,rope,f.d);
      g.fillStyle(0xff9a3c,0.28);g.fillCircle(P.x,P.y,sz*2.4);g.fillStyle(0xffd27a,0.75);g.fillCircle(P.x,P.y,sz*1.3);g.fillStyle(0xffffff,1);g.fillCircle(P.x,P.y,sz*0.65);
      const ns=4+Math.round(6*pw);
      for(let i=0;i<ns;i++){const a=rnd(0,6.283),l=rnd(sz*0.9,sz*2.8);g.lineStyle(2,i%2?0xffe08a:0xffffff,0.9);g.lineBetween(P.x,P.y,P.x+Math.cos(a)*l,P.y+Math.sin(a)*l);}
    }
  }

  /* --- 花火：導火線 --- */
  fuseXY(h,r,d){ // 導火線の火花の位置：紐を自機側からたどり、最後は刺さった銛の中を敵の先端まで
    const Lr=polyLen(r);if(d<=Lr)return polyAt(r,d);
    const sa=h.tg?h.rel+h.tg.a:0,k=Math.min(d-Lr,h.sl);
    return{x:h.b.x+Math.cos(sa)*k,y:h.b.y+Math.sin(sa)*k};
  }
  stepFuse(h,r,pvx,pvy){ // 火花が走る。敵に届いたら花火を上げ、間隔（FW_GAP）をおいて、また自機側から走る（刺さっている間くり返す）
    const f=h.fz;
    if(f.w>0){f.w=Math.max(0,f.w-STEP);return;} // 花火のあとの間隔：火花は出ない
    f.t+=STEP;f.d+=FW_SPD*STEP;
    if(f.d>=polyLen(r)+h.sl){this.fireworks(h,pvx,pvy,fwPow(f.t));f.d=0;f.t=0;f.w=FW_GAP;}
  }
  fireworks(h,pvx,pvy,p){ // 花火：強さp(0〜1)に応じた大きさ・ダメージ（吹き飛ばしはしない）。ダメージは銛が外れるまでの時間をリセットしない（爆弾と同じ）
    const e=h.tg;if(!e)return;
    const T=this.tail(),sa=h.rel+e.a,x=T.x+Math.cos(sa)*h.sl,y=T.y+Math.sin(sa)*h.sl,cam=this.cameras.main;
    const R=FW_R0+(FW_R1-FW_R0)*p,pal=FW_PAL[Math.floor(Math.random()*FW_PAL.length)];
    // 打ち上げ花火らしく：星が尾を引きながら広がり、重力で垂れ、色が変わりながらチカチカ消える。外側の輪・内側の輪（色違い）・中心の小さな星
    const star=(sp,ang,c,life,drag,tw)=>this.fwk.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,t:0,life,c,drag,tw,tl:6,trail:[]});
    const n1=16+Math.round(14*p),n2=8+Math.round(8*p),n0=4+Math.round(4*p),ph=rnd(0,6.283); // 星の数（多いほど重くなる）
    for(let i=0;i<n1;i++)star(R*2.3*rnd(0.9,1),ph+i/n1*6.283+rnd(-0.05,0.05),pal[0],rnd(1.2,1.6),2.2,true);
    for(let i=0;i<n2;i++)star(R*1.5*rnd(0.9,1),ph+0.12+i/n2*6.283,pal[1],rnd(1.0,1.4),2.2,true);
    for(let i=0;i<n0;i++)star(R*rnd(0.4,0.9),rnd(0,6.283),0xffffff,rnd(0.8,1.1),2.6,false);
    this.fwf.push({x,y,t:0,R});
    this.hitE.explode(4+Math.round(8*p),x,y);
    cam.shake(110+190*p,0.006+0.014*p);this.softFlash(90,255,225,170,0.22+0.2*p);this.freeze=Math.max(this.freeze,0.04+0.06*p);this.punch=Math.max(this.punch,0.08+0.12*p);
    if(!playSnd('firework',0.75+0.25*p)){ // 花火の音：firework.mp3（読み込み前だけ合成音）
      sfx(1900,260,0.14,0.3,'sawtooth');sfx(160-60*p,30,0.25+0.3*p,0.45,'sawtooth');sfx(3200,900,0.12,0.2,'triangle');
      for(let k=0;k<3+Math.round(4*p);k++)this.time.delayedCall(180+k*(60+Math.random()*50),()=>sfx(2200+Math.random()*1800,900,0.04,0.14,'square')); // パチパチと弾ける音
    }

  /* --- 銛・ロープの1ステップ --- */
  stepHarpoon(q){
    const h=this.h,r=this.rope,e=this.e,b=h.b,pvx=q.pvx,pvy=q.pvy;
    if(h.st!=='stuck'&&h.sl<LEN){ // 刺さりが外れた：縮んでいた分、後端を後ろへ戻して先端の位置を保つ
      const k=LEN-h.sl;b.x-=Math.cos(h.sdir)*k;b.y-=Math.sin(h.sdir)*k;b.px=b.x;b.py=b.y;h.sl=LEN;
    }
    for(let i=1;i<NSEG;i++){ // ロープの点（支点と銛の後端以外）
      const n=r[i],vx=(n.x-n.px)*0.97,vy=(n.y-n.py)*0.97;
      n.px=n.x;n.py=n.y;n.x+=vx;n.y+=vy;
    }
    r[0].x=r[0].px=pvx;r[0].y=r[0].py=pvy;
    if(h.st==='fly'){
      b.x+=h.ux*this.spd*STEP;b.y+=h.uy*this.spd*STEP;
      const tx=b.x+h.ux*LEN,ty=b.y+h.uy*LEN;
      h.trail.push({x:tx,y:ty});if(h.trail.length>10)h.trail.shift();
      const c0=Math.hypot(b.x-pvx,b.y-pvy);
      if(c0>this.ropeLen)this.ropeLen=Math.min(c0,RMAX); // 紐は最大の長さまで伸びる
      if(this.probe(tx,ty)){/* 刺さった／弾かれた */}
      else if(arPush(tx,ty,0)){ // 壁に刺さって止まる（押すまで戻らない）
        const w=arPush(tx,ty,0),un=h.ux*w.nx+h.uy*w.ny,m=un>0.05?w.pen/un:0;
        b.x-=h.ux*m;b.y-=h.uy*m;b.px=b.x;b.py=b.y;
        // 刺さらず、小さく跳ね返って漂い始める
        let vx=h.ux*this.spd,vy=h.uy*this.spd;
        const vn=vx*w.nx+vy*w.ny,vtx=vx-vn*w.nx,vty=vy-vn*w.ny;
        vx=-vn*w.nx*DRIFT_BOUNCE+vtx*DRIFT_BOUNCE*1.4;vy=-vn*w.ny*DRIFT_BOUNCE+vty*DRIFT_BOUNCE*1.4;
        h.dvx=vx;h.dvy=vy;h.ang=Math.atan2(h.uy,h.ux);h.dw=rnd(-2.2,2.2);
        h.st='drift';h.trail.length=0;
        const wx=b.x+h.ux*LEN,wy=b.y+h.uy*LEN;
        this.hitE.explode(10,wx,wy);this.cameras.main.shake(70,0.004);pingSfx(0.35,1,0.9);
      }
      else if(c0>=RMAX){ // 紐が最大の長さまで伸びきった：何にも当たらなかったので、その場でふわっと漂い始める（押すと引き戻す）
        h.dvx=h.dvy=0;h.ang=Math.atan2(h.uy,h.ux);h.dw=rnd(-2.2,2.2);h.st='drift';h.trail.length=0;
        this.hitE.explode(6,tx,ty);sfx(700,300,0.08,0.18,'triangle');
      }
    }
    if(h.st==='drift'){ // 壁際をゆっくり漂う
      const k=Math.exp(-DRIFT_DAMP*STEP);
      h.dvx=h.dvx*k+(Math.random()-0.5)*DRIFT_WOBBLE*STEP;h.dvy=h.dvy*k+(Math.random()-0.5)*DRIFT_WOBBLE*STEP;
      h.dw=h.dw*Math.exp(-0.7*STEP)+(Math.random()-0.5)*1.5*STEP;
      b.x+=h.dvx*STEP;b.y+=h.dvy*STEP;h.ang+=h.dw*STEP;
      // 銛の両端が壁の内側に収まるように、軽く跳ね返す
      let bounced=false;
      for(let it=0;it<3;it++){
        const ex=b.x+Math.cos(h.ang)*LEN,ey=b.y+Math.sin(h.ang)*LEN,w1=arPush(b.x,b.y,0),w2=arPush(ex,ey,0),w=(w1&&w2)?(w1.pen>=w2.pen?w1:w2):(w1||w2);

        if(dn>0){h.dvx-=1.5*dn*w.nx;h.dvy-=1.5*dn*w.ny;h.dw+=rnd(-1,1);bounced=true;}
      }
      {const dd=Math.hypot(b.x-pvx,b.y-pvy);if(dd>RMAX){const f=RMAX/dd;b.x=pvx+(b.x-pvx)*f;b.y=pvy+(b.y-pvy)*f;}} // 紐の最大の長さより外へは漂わない（自機が動くと、紐に引かれてついてくる）
      b.px=b.x;b.py=b.y;
      if(bounced&&Math.hypot(h.dvx,h.dvy)>40)pingSfx(0.12,1.5,0.35); // 漂う銛が壁で跳ね返る：小さくて軽い金属音（高め・余韻短め）
      this.ropeLen=Math.hypot(pvx-b.x,pvy-b.y)*1.05+10; // 紐は少したるんだまま
    }
    if(h.st==='back'){
      h.trail.length=0;
      let tx=pvx,ty=pvy;if(this.eq()==='scatter'&&h.slot){tx-=Math.sin(q.psi)*h.slot*SC_OFF;ty+=Math.cos(q.psi)*h.slot*SC_OFF;} // 散弾：自分の砲身（左右は発射位置）へ戻る
      const dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy)||1,sp=Math.min(d,1500*STEP);
      b.x+=dx/d*sp;b.y+=dy/d*sp;
      this.ropeLen=Math.hypot(pvx-b.x,pvy-b.y)*1.03;
      if(d<26&&(this.inEx||!this.ex.length)){this.catchH(q);return;} // 本体は、左右の銛が全部戻りきるまで回収を待つ
      if(d<26&&this.ld&&this.ld[(h.slot||0)+1]===null){this.ld[(h.slot||0)+1]=0.12;h.home=true;} // 本体は待っている間も、自分の砲身にはセットされる（待つ銛は描かない）
    }else if(h.st==='stuck'){
      const tg=h.tg;
      if(!tg||tg.dead){h.st='back';}
      else{
        // 銛が伸縮：敵が自機に近づくほど縮み、離れると元の長さに戻る（回収されず、敵が自機の壁際まで届く）
        h.sl=LEN;const Tf=this.tail(),sa=h.rel+tg.a,tipx=Tf.x+Math.cos(sa)*LEN,tipy=Tf.y+Math.sin(sa)*LEN;

        h.sl=cap<prev?Math.max(cap,prev-1600*STEP):Math.min(cap,LEN,prev+500*STEP);h.slPrev=h.sl;h.sdir=sa;
        const T=this.tail();b.x=b.px=T.x;b.y=b.py=T.y;

        if(h.fz)this.stepFuse(h,r,pvx,pvy);
        if(h.st==='stuck'&&h.stT>=this.stuckT)this.shatter();
      }
    }
    const seg=this.ropeLen/NSEG;
    for(let it=0;it<14;it++){
      for(let i=0;i<NSEG;i++){
        const a=r[i],c=r[i+1],dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy)||1e-6,f=(d-seg)/d;
        if(i===0){c.x-=dx*f;c.y-=dy*f;}

        else{a.x+=dx*f*0.5;a.y+=dy*f*0.5;c.x-=dx*f*0.5;c.y-=dy*f*0.5;}
      }
    }
    this.taut=Math.hypot(b.x-pvx,b.y-pvy)>=this.ropeLen*0.985;
  }

    this.vel+=(inx*SPEED*this.mv-this.vel)*(1-Math.exp(-(inx*this.vel<0?TURN_K:14)*STEP)); // 今の動きと逆向きに入力したときだけ、追従を速くする（切り返しブースト）

      for(const x of this.ex)if(x.h.st==='drift')x.h.st='back'; // 左右の銛も同じ

      if(this.h&&this.h.st==='stuck'&&this.e&&this.h.tg===this.e&&this.e.type==='boss'&&this.h.arm>=0)this.tearHit(this.h.arm); // ボスの盾に刺さっていれば、連打でちぎれていく

      const ht=b.hit,fd=Math.max(0.15,Math.min(1,b.len/ht.len0*2)),r=15+5*Math.sin(ht.t*24)+3*Math.sin(ht.t*41+1);

  drawBoss(g,e,pal,q){ // ボス（本体の座標系：+xが正面）

      g.lineStyle(2,pal.c1,0.85);g.lineBetween(sx+(hx-sx)*0.12,sy+(hy-sy)*0.12,sx+(hx-sx)*0.9,sy+(hy-sy)*0.9);

  drawClam(g,e,pal){ // 貝（本体座標：前が+x）。中の小さな本体と、真ん中で二つに割れる四角いシールド

  draw(q){

    for(const i of this.imps){const k=i.t/0.35,sz=i.s||1;if(i.fill){g.fillStyle(0xffb347,0.55*(1-k));g.fillCircle(i.x,i.y,(10+i.t*420)*0.55*sz);}g.lineStyle(3*sz,i.c||0xffffff,1-k);g.strokeCircle(i.x,i.y,10+i.t*420*sz);}

        const n=f.trail.length,w=1+2.2*(1-k); // 尾：記録した位置から3点だけ取って、先へ行くほど濃く太い3本の線で描く（描画回数を減らすため）
        if(n>1){const a=f.trail[0],m=f.trail[n>>1],c=f.trail[n-1];

        gl.fillStyle(col,al*0.25);gl.fillCircle(f.x,f.y,6*FW_DOT*(1-k*0.5));gl.fillStyle(col,al);gl.fillCircle(f.x,f.y,2.2*FW_DOT*(1-k*0.4));
      }
    }
    for(const c of this.chunks){
      const k=c.t/c.life,al=k<0.6?1:1-(k-0.6)/0.4,s1=c.s0+c.st,cx=Math.cos(c.mid)*c.r*0.55,cy=Math.sin(c.mid)*c.r*0.55;
      const P0={x:Math.cos(c.s0)*c.r-cx,y:Math.sin(c.s0)*c.r-cy},P1={x:Math.cos(s1)*c.r-cx,y:Math.sin(s1)*c.r-cy};
      const O={x:-cx,y:-cy},T={x:Math.cos(c.mid)*(c.r+11)-cx,y:Math.sin(c.mid)*(c.r+11)-cy};
      g.save();g.translateCanvas(c.x,c.y);g.rotateCanvas(c.a);
      g.fillStyle(c.pal.c0,al);g.fillTriangle(O.x,O.y,P0.x,P0.y,P1.x,P1.y);
      g.fillStyle(c.pal.c1,al);g.fillTriangle(P0.x,P0.y,T.x,T.y,P1.x,P1.y);
      g.lineStyle(2,c.pal.c2,al);g.lineBetween(P0.x,P0.y,P1.x,P1.y);g.lineBetween(O.x,O.y,P0.x,P0.y);g.lineBetween(O.x,O.y,P1.x,P1.y);
      g.restore();
    }
    for(const sh of this.shards){const k=sh.t/0.75,l=6+9*(1-k),al=1-k; // ガラスの欠片：半透明の三角形＋白い縁＋色のついた辺
const ax=sh.x+Math.cos(sh.a)*l,ay=sh.y+Math.sin(sh.a)*l,bx=sh.x+Math.cos(sh.a+2.2)*l*0.7,by=sh.y+Math.sin(sh.a+2.2)*l*0.7,cx=sh.x+Math.cos(sh.a-2.4)*l*0.55,cy=sh.y+Math.sin(sh.a-2.4)*l*0.55;
g.fillStyle(sh.c,0.32*al);g.fillTriangle(ax,ay,bx,by,cx,cy);
g.lineStyle(1.5,0xffffff,0.85*al);g.strokeTriangle(ax,ay,bx,by,cx,cy);
g.lineStyle(2,sh.c,al);g.lineBetween(ax,ay,bx,by);}
    // 敵
    for(const e of this.es){
      if(e.tele>0){ // 突進の予告
        const k=e.tele/(e.teleMax||0.6);
        g.lineStyle(3,0xff3355,0.5+0.5*(Math.floor(e.tele*20)%2));g.strokeCircle(e.x,e.y,(e.r||ER)+8+20*k);
        g.lineStyle(2,0xff3355,0.35);g.lineBetween(e.x,e.y,q.p.x,q.p.y);
      }
      g.save();g.translateCanvas(e.x+(e.jx||0),e.y+(e.jy||0));g.rotateCanvas(e.a);GLASS_ROT=e.a;
      const pal=e.kind==='eyes'?EPAL.eyes:(EPAL[e.type]||EPAL.norm);
      if(e.type==='boss')this.drawBoss(g,e,pal,q);
      else if(e.type==='clam')this.drawClam(g,e,pal);
      else if(e.type==='beamer')this.drawTurret(g,0,0,1,(e.emit>0?e.aimA:Math.atan2(q.p.y-e.y,q.p.x-e.x))-e.a,e.chg>0?1-e.chg/BM_CHG:(e.emit>0?1:0),0,1,'beamer'); // ロングビームの敵：目玉の敵と同じ姿でオレンジ
      else if(e.type==='eyes')this.drawTurret(g,0,0,1,(e.emit>0?e.aimA:Math.atan2(q.p.y-e.y,q.p.x-e.x))-e.a,e.chg>0?1-e.chg/EYE_CHG:(e.emit>0?1:0)); // 黒目の向きは世界の向き（本体の回転を引いて、本体の向きに影響されない）
      else{
      g.fillStyle(pal.c1,1);
      for(let i=0;i<pal.n;i++){
        const a=i*Math.PI*2/pal.n,c=Math.cos(a),s=Math.sin(a),r0=ER-4;
        g.fillTriangle(c*r0-s*9,s*r0+c*9,c*r0+s*9,s*r0-c*9,c*(ER+11),s*(ER+11));g.lineStyle(1.2,0xffffff,0.5*1);g.strokeTriangle(c*r0-s*9,s*r0+c*9,c*r0+s*9,s*r0-c*9,c*(ER+11),s*(ER+11));
      }
      g.fillStyle(pal.c0,1);g.fillCircle(0,0,ER);
      g.lineStyle(3,pal.c2,1);g.strokeCircle(0,0,ER);
      g.fillStyle(pal.c2,1);g.fillCircle(ER*0.4,-7,5);g.fillCircle(ER*0.4,7,5);glassOv(g,ER,pal,e.a);
      }
      g.restore();
      GLASS_ROT=0;if(e.flash>0.02){g.fillStyle(0xffffff,0.7*e.flash);g.fillCircle(e.x,e.y,(e.r||ER)+4);}
      if(e.type==='boss'&&((e.grip||0)>0.02||e.limp>0)){ // 本体の綱引きゲージ：連打で溜まる（赤く染まり、円のバーが増える）。フルで力が抜け、青いバーが減っていく間は引き返さない
        const lm=e.limp>0,R=e.r+12,fr=lm?e.limp/LIMP_T:Math.min(1,e.grip);
        if(lm){g.lineStyle(7,0x66e0ff,0.3);g.strokeCircle(e.x,e.y,R);}
        else{g.fillStyle(0xff3355,Math.min(0.6,e.grip*0.7));g.fillCircle(e.x,e.y,e.r+3);}
        g.lineStyle(5,lm?0x66e0ff:0xffffff,0.95);g.beginPath();g.arc(e.x,e.y,R,-Math.PI/2,-Math.PI/2+Math.PI*2*fr,false);g.strokePath();
      }
    }
    if(this.es.length)for(const b of this.bul)this.drawLaser(g,b);
    // ちぎれた盾
    for(const pc of this.pieces){
      const left=PC_LIFE-pc.t,al=(left<2.5&&Math.floor(pc.t*8)%2)?0.35:1,pal=EPAL.boss,L=pc.L||PC_L; // 板の長さは、ちぎる前の盾と同じ
      if(pc.type==='turret'){this.drawTurret(g,pc.x,pc.y,TURR/ER,0,-1,pc.a,al);g.lineStyle(3,0xff3355,0.85*al);g.strokeCircle(pc.x,pc.y,TURR+2);} // ちぎれた砲台（光なし）
      else{
      g.save();g.translateCanvas(pc.x,pc.y);g.rotateCanvas(pc.a);
      const qd=plateQuad(-L,0,L,0,SH_R);g.fillStyle(pal.c0,al);g.fillPoints(qd,true);g.lineStyle(3,pal.c2,al);g.strokePoints(qd,true);
      g.lineStyle(2,pal.c1,0.85*al);g.lineBetween(-L+2*L*0.12,0,-L+2*L*0.9,0); // 盾についていた線と同じ位置（断面の赤線は描かない）
      g.restore();
      }
      if(pc.flash>0.02){g.fillStyle(0xffffff,0.7*pc.flash);g.fillCircle(pc.x,pc.y,pc.r*0.8);}
    }
    // 照準線
    if(e&&!h){
      const ux=Math.cos(q.psi),uy=Math.sin(q.psi),dist=Math.hypot(e.x-q.pvx,e.y-q.pvy);
      g.lineStyle(2,0xffb347,0.28);
      for(let t=40;t<dist-(e.r||ER)-6;t+=15)g.lineBetween(q.pvx+ux*t,q.pvy+uy*t,q.pvx+ux*(t+6),q.pvy+uy*(t+6));
    }
    for(const x of this.ex)this.drawHarp(g,q,x.h,x.rope,false,x.taut,'harp'); // 左右の銛（散弾）。銛は本体の下、紐は本体の上に描く
    this.drawHarp(g,q,h,this.rope,true,undefined,'harp');
    // 機械本体（レールに対して角度固定）。無敵中は点滅
    const rc=this.recoil,ma=(this.inv>0&&(Math.floor(this.inv*16)%2))?0.3:1;
    g.save();g.translateCanvas(q.p.x,q.p.y);g.rotateCanvas(q.phi);g.scaleCanvas(BS,BS);
    const skn=SHIP_SKIN[this.eq()]||SHIP_SKIN.std; // 装備中の砲台の見た目
    g.fillStyle(skn.wh,ma);g.fillRoundedRect(-10,-24,20,11,3);g.fillRoundedRect(-10,13,20,11,3);
    g.fillStyle(skn.ax,ma);g.fillCircle(0,-18,3.5);g.fillCircle(0,18,3.5);
    g.fillStyle(skn.bd,ma);g.fillRoundedRect(3-rc,-14,24,28,6);
    g.lineStyle(2,skn.ol,ma);g.strokeRoundedRect(3-rc,-14,24,28,6);
    if(skn.bodyDeco)skn.bodyDeco(g,rc,ma);
    g.restore();
    for(const x of this.ex)this.drawHarp(g,q,x.h,x.rope,false,x.taut,'rope'); // 紐：本体より上、発射台（銃身）より下
    this.drawHarp(g,q,h,this.rope,true,undefined,'rope');
    if(this.shn>0){ // シールド：自機を覆って回る多角形（1枚=三角形、2枚=四角形…）
      const N=this.shn+2,cx=q.p.x+Math.cos(q.phi)*8,cy=q.p.y+Math.sin(q.phi)*8,pts=[];
      for(let k=0;k<N;k++){const a=this.shA+k*Math.PI*2/N;pts.push({x:cx+Math.cos(a)*PSH_R,y:cy+Math.sin(a)*PSH_R});}
      g.fillStyle(0x66e0ff,0.12);g.fillPoints(pts,true);
      g.lineStyle(8,0x66e0ff,0.22);g.strokePoints(pts,true);

      g.fillStyle(0xffffff,0.95);for(const v of pts)g.fillCircle(v.x,v.y,3.2);

    if(this.eq()==='scatter'){ // 散弾：砲身ごとに、セット済み（戻って装填の待ちが終わった）の銛を描く。真ん中・左右とも同じ形
      for(const sl of[-1,0,1]){const v=this.ld[sl+1];if(v!==null&&v!==undefined&&v<=0){g.save();g.translateCanvas(0,sl*SC_OFF);g.rotateCanvas(sl*SC_SPREAD);g.translateCanvas(-6,0);this.harpoon(g,LEN,false,false);g.restore();}}
    }else if(!h&&this.cool<=0){const bm=this.eq()==='bomb',ox=bm?82-LEN:-6;g.translateCanvas(ox,0);this.harpoon(g,LEN,bm,this.eq()==='firework');g.translateCanvas(-ox,0);} // 爆弾：爆弾の後ろ端（中心-半径12）が銃身の先端（18×BS=36）にちょうど触れる位置にセット // 装填中の銛を先に描いて、そのあとに銃身を重ねる（銃身が銛より上）
    g.scaleCanvas(BS,BS);g.fillStyle(skn.ba,ma);if(skn.barBody)skn.barBody(g,ma);else g.fillRoundedRect(-10,-6,28,12,4);if(skn.barDeco)skn.barDeco(g,ma); // 銃身は角が丸い四角 // 銃身：前端は据え置き。後ろ端は、装填中の銛の尻（中心-6・半径3.5＝-9.5）をギリギリ覆う位置
    g.restore();
  }

  update(time,delta){
    if(screen!=='play'||this.pickOn)return; // ホーム画面・強化を選んでいる間はゲームを止めておく
    const dr=Math.min(delta,50)/1000;
    this.punch*=Math.exp(-12*dr);this.wallF*=Math.exp(-9*dr);
    for(const x of this.es)x.flash*=Math.exp(-12*dr);
    for(const pc of this.pieces)pc.flash*=Math.exp(-12*dr);
    for(const i of this.imps)i.t+=dr;
    if(this.cells)for(const c of this.cells)c.fl*=Math.exp(-7*dr);this.spkCD-=dr;this.stepTurret(dr);
    for(const sh of this.shards){sh.t+=dr;sh.x+=sh.vx*dr;sh.y+=sh.vy*dr;sh.a+=sh.w*dr;const k=Math.exp(-2.6*dr);sh.vx*=k;sh.vy*=k;}
    for(const c of this.chunks){c.t+=dr;c.x+=c.vx*dr;c.y+=c.vy*dr;c.a+=c.w*dr;const k=Math.exp(-1.8*dr);c.vx*=k;c.vy*=k;}
    this.chunks=this.chunks.filter(c=>c.t<c.life);
    {const ga=Math.PI/2-this.cameras.main.rotation,gx=Math.cos(ga)*FW_G,gy=Math.sin(ga)*FW_G; // 画面の下向き（カメラが回るレールでも）
      for(const f of this.fwk){f.t+=dr;f.trail.push({x:f.x,y:f.y});if(f.trail.length>f.tl)f.trail.shift();const k=Math.exp(-f.drag*dr);f.vx=f.vx*k+gx*dr;f.vy=f.vy*k+gy*dr;f.x+=f.vx*dr;f.y+=f.vy*dr;}
      for(const f of this.fwf)f.t+=dr;
      this.fwk=this.fwk.filter(f=>f.t<f.life);this.fwf=this.fwf.filter(f=>f.t<0.3);}
    this.shards=this.shards.filter(sh=>sh.t<0.75);
    this.imps=this.imps.filter(i=>i.t<0.35);
    if(this.msgT>0){this.msgT-=dr;if(this.msgT<=0)msgEl.style.opacity=0;}
    if(this.slowCD>0)this.slowCD-=dr;
    if(this.slowT>0){this.slowT-=dr;this.slowLen+=dr;if(this.slowLen>SLOW_MAX){this.slowT=0;this.slowLen=0;this.slowCD=SLOW_CD;}}
    else if(this.slowLen>0){this.slowLen=0;this.slowCD=SLOW_CD;}
    if(this.tutOn)this.ts=this.tutUpdate(dr);else this.ts+=((this.slowT>0?SLOW_V:1)-this.ts)*(1-Math.exp(-18*dr)); // スローの入り・戻りはなめらかに（チュートリアル中は専用の進み方）
    if(this.freeze>0)this.freeze-=dr;
    else{this.acc+=dr;while(this.acc>=STEP0){STEP=STEP0*this.ts;this.step();this.acc-=STEP0;}STEP=STEP0;} // スローは、1ステップが進める時間を短くして表現する（ステップの回数は減らさないので、カクつかない）

    const q=this.gp(),p=q.p,cam=this.cameras.main,W=this.scale.width,H=this.scale.height;
    // カメラ：自機→中心が画面の真上を向くよう回す。アリーナ全体が見える大きさに合わせる
    const lv=RAIL.open?lineView(W,H,AR.rect):null,zb=lv?lv.z:Math.min(ZOOM_RATE*H,W/VIEW_W),z=zb*(1+this.punch); // 直線はlineViewの大きさ
    cam.setZoom(z);
    if(RAIL.open){cam.setRotation(0);cam.centerOn(0,lv.cy);} // 直線：回さず、横は中央に固定
    else{const dd=Math.hypot(p.x,p.y)||1,dx=-p.x/dd,dy=-p.y/dd;cam.setRotation(-Math.PI/2-Math.atan2(dy,dx));cam.centerOn(0,0);} // アリーナの中心を画面の真ん中に置く（自機は回転で常に下側。以前は自機寄りに0.35ずらしていた）
    for(const t of this.dmgT){ // ダメージ数値：ドンと大きく出て縮み（ばね）、上へ少し昇りながら、後半で薄くなって消える。画面に対して正立・画面上で同じ大きさ
      t.age+=dr;const a=t.age,u=Math.min(1,a/0.16),e3=1-Math.pow(1-u,3);
      let pop=(t.big?2.3:1.9)-((t.big?2.3:1.9)-1)*e3; // 大きく出て1に落ち着く
      if(a>=0.16&&a<0.3)pop=1+0.12*Math.sin((a-0.16)/0.14*Math.PI); // 着地でひと跳ね
      const rise=48*(1-Math.pow(1-Math.min(1,a/0.9),2)),ux=-Math.sin(cam.rotation),uy=-Math.cos(cam.rotation); // 画面の上向き（カメラが回るレールでも）。世界上で昇る
      if(t.rb)t.setColor('hsl('+((t.age*540+t.hue)%360)+',100%,62%)'); // 虹：色相を回し続ける
      t.setPosition(t.bx+ux*rise,t.by+uy*rise).setRotation(-cam.rotation).setScale(pop/z).setAlpha(a<0.6?1:Math.max(0,1-(a-0.6)/0.4));
    }
    this.dmgT=this.dmgT.filter(t=>{if(t.age>=1){t.destroy();return false;}return true;});

    this.draw(q);
    {let hs=0,ms=0;for(const x of this.es){hs+=Math.max(0,x.hp);ms+=x.max;}ms=Math.max(ms,this.hpMax0||0);ebf.style.width=(ms?hs/ms*100:0)+'%';} // 敵が複数のときは全員の合計HP。最大値はステージ開始時の合計（倒した敵の分も含む）
    kn.style.transform=`translate(${knX*45}px,${knY*45}px)`;
    fb.classList.toggle('on',held());fb.classList.toggle('reel',this.reeling);
    fb.style.boxShadow=this.reeling?`0 0 ${14+30*(this.reeling?1:0)}px rgba(255,${Math.round(179-100*(this.reeling?1:0))},71,.8)`:'';
    const lbl=this.h?'REEL':'FIRE';if(lbl!==this.lbl){fb.textContent=lbl;this.lbl=lbl;}
  }
}
